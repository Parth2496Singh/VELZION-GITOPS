apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image }}:{{ .Values.backend.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.database.user }}:{{ .Values.database.password }}@db:5432/{{ .Values.database.dbName }}"
            - name: DJANGO_SETTINGS_MODULE
              value: "core.settings"
            - name: DJANGO_DEBUG
              value: {{ .Values.backend.debug | quote }}
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://{{ .Values.global.domain }}"
            - name: GITHUB_CLIENT_ID
              value: {{ .Values.backend.githubClientId | quote }}
            - name: GITHUB_CLIENT_SECRET
              value: {{ .Values.backend.githubClientSecret | quote }}
            - name: FRONTEND_URL
              value: "http://{{ .Values.global.domain }}"
            - name: N8N_WEBHOOK_SECRET
              value: {{ .Values.backend.n8nWebhookSecret | quote }}