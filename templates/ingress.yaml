apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: velzion-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
    - host: {{ .Values.global.domain | quote }}
      http:
        paths:
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /n8n/
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80