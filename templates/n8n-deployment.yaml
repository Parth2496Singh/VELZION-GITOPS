apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n
spec:
  serviceName: "n8n"
  replicas: {{ .Values.n8n.replicaCount }}
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: volume-permissions
          image: busybox:1.36
          command: ['sh', '-c', 'chown -R 1000:1000 /home/node/.n8n']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      containers:
        - name: n8n
          image: "{{ .Values.n8n.image }}:{{ .Values.n8n.tag }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 5678
          env:
            - name: N8N_HOST
              value: "0.0.0.0"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            # Pointing to the new NodePort 30768
            - name: WEBHOOK_URL
              value: "http://{{ .Values.global.domain }}:30768/n8n/"
            - name: N8N_EDITOR_BASE_URL
              value: "http://{{ .Values.global.domain }}:30768/n8n/"
            - name: N8N_SECURE_COOKIE
              value: "false"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
  volumeClaimTemplates:
    - metadata:
        name: n8n-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: {{ .Values.n8n.storageSize }}
